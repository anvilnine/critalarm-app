name: critalarm
description: "Crit Alarm — a self-hostable, ntfy-compatible alarm that rings through Do Not Disturb until you acknowledge it."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  easy_localization: ^3.0.8
  envied: ^1.3.8
  firebase_analytics: ^12.5.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_messaging: ^16.0.0
  firebase_remote_config: ^6.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.0.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  http: ^1.6.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.6
  purchases_flutter: ^10.12.0
  purchases_ui_flutter: ^10.12.0
  result_dart: ^2.2.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  uuid: ^4.5.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  envied_generator: ^1.3.8
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/fonts/Anton-OFL.txt
    - assets/fonts/Archivo-OFL.txt
    - assets/fonts/IBMPlexMono-OFL.txt
  # PLACEHOLDER FACES. docs/design-system/NOTES.md calls for
  # Bricolage Grotesque 800 (display),
  # Instrument Sans 400-600 (body) and JetBrains Mono (machine strings). A0
  # swaps the files and the family constants in
  # lib/design_system/tokens/typography.dart. The wiring below is the part
  # worth keeping.
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
          weight: 400
    # Archivo ships as static per-weight instances cut from the upstream
    # variable font (fonttools varLib.instancer, wght pinned per file,
    # wdth=100). Statics are deliberate: registering one variable asset per
    # weight still rendered the default instance on web CanvasKit, so heavy
    # eyebrows and labels silently lost their weight.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

flutter_gen:
  output: lib/gen/
  assets:
    outputs:
      directory_path_enabled: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  min_sdk_android: 28
  adaptive_icon_background: "#FF8A1F"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/icon/ic_launcher_monochrome.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FF8A1F"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#101112"
    theme_color: "#FF8A1F"
