name: critalarm
description: "Crit Alarm — a self-hostable, ntfy-compatible alarm that rings through Do Not Disturb until you acknowledge it."
publish_to: 'none'
version: 0.1.0+10

environment:
  sdk: ^3.12.2

dependencies:
  confetti: ^0.8.0
  crypto: ^3.0.7
  device_info_plus: ^12.4.0
  easy_localization: ^3.0.8
  envied: ^1.3.8
  file_selector: ^1.1.0
  firebase_analytics: ^12.5.0
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_messaging: ^16.0.0
  firebase_remote_config: ^6.6.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^22.0.1
  flutter_slidable: ^4.0.3
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  in_app_review: ^2.0.12
  intl: ^0.20.2
  json_annotation: ^4.12.0
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  purchases_flutter: ^10.12.0
  purchases_ui_flutter: ^10.12.0
  quick_actions: ^1.1.1
  record: 7.1.1
  result_dart: ^2.2.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.2.0
  sqflite: ^2.4.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.0
  envied_generator: ^1.3.8
  flutter_gen_runner: ^5.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.3.6
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/edge_blur.frag
  assets:
    - assets/translations/
    - assets/sounds/
    - assets/docs/
    - assets/reminder_faces/
    - assets/fonts/Anton-OFL.txt
    - assets/fonts/Archivo-OFL.txt
    - assets/fonts/IBMPlexMono-OFL.txt
    - assets/fonts/BricolageGrotesque-OFL.txt
    - assets/fonts/InstrumentSans-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  # The three faces docs/design-system/NOTES.md calls for. Anton, Archivo and
  # IBMPlexMono stay registered below as the fallback chain in
  # lib/design/tokens/typography.dart.
  #
  # All three are static per-weight instances cut from the upstream variable
  # fonts with fonttools varLib.instancer, same as Archivo. Only the weights
  # the app actually asks for are cut, so the bundle stays small.
  #
  # Bricolage Grotesque carries an optical size axis, which a static file has
  # to pin. Flutter cannot vary it by font size the way the web build does, so
  # each weight is pinned at the size it is used at: 800 is the hero and the
  # section headlines (36 px and up) so it takes opsz=72, 700 is card titles
  # and tab labels (11 to 20 px) so it takes opsz=14.
  fonts:
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
          weight: 400
    # Archivo ships as static per-weight instances cut from the upstream
    # variable font (fonttools varLib.instancer, wght pinned per file,
    # wdth=100). Statics are deliberate: registering one variable asset per
    # weight still rendered the default instance on web CanvasKit, so heavy
    # eyebrows and labels silently lost their weight.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

flutter_gen:
  output: lib/gen/
  assets:
    outputs:
      directory_path_enabled: true

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  min_sdk_android: 28
  adaptive_icon_background: "#FF8A1F"
  adaptive_icon_foreground: "assets/icon/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/icon/ic_launcher_monochrome.png"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FF8A1F"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#101112"
    theme_color: "#FF8A1F"
